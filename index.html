/* Una sola pantalla, estética de las cartas: anillos de vinilo setenteros sobre papel crema */
:root{
  --paper:#FBF1DC; --cream:#F3E1BE; --ink:#3A2216;
  --mustard:#E7A23A; --orange:#D9692C; --rust:#A6422B; --rose:#E3A39C;
  --olive:#7D8A3B; --teal:#2D6B67; --plum:#6E3A55;
  --display:"Shrikhand",Georgia,serif; --body:"DM Sans",system-ui,sans-serif; --serif:"Fraunces",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--teal);color:var(--ink);font:16px/1.4 var(--body);overflow:hidden;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}

/* fondo de anillos */
.rings{position:fixed;inset:0;z-index:-1;background:
  repeating-radial-gradient(circle at 50% 42%,
    var(--rust) 0 34px,var(--orange) 34px 68px,var(--mustard) 68px 102px,var(--rose) 102px 136px,var(--olive) 136px 170px,var(--teal) 170px 204px)}
.rings::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 0 40%,rgba(58,34,22,.25) 100%)}

.logo{font-family:var(--display);font-size:clamp(44px,13vw,64px);line-height:1;color:var(--mustard);
  text-shadow:3px 3px 0 var(--ink);letter-spacing:.5px;text-align:center}
.plate{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:22px 22px 24px;width:min(100%,380px);
  box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.plate p{margin:0;max-width:30ch}
.small{font-size:13px;opacity:.8}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:999px;
  background:var(--orange);color:var(--paper);font-weight:700;font-size:18px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;letter-spacing:.2px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.teal{background:var(--teal)}
.btn.big{min-height:68px;font-size:20px;padding:0 34px}
.link{text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:8px}
.daisy{width:34px;height:34px;flex:none}

/* escáner */
#scan{background:#000;justify-content:flex-start;padding:0;gap:0}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:44%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:26px;box-shadow:0 0 0 2000px rgba(30,16,10,.55);border:4px solid var(--mustard)}
.frame::after{content:"";position:absolute;left:8%;right:8%;height:3px;background:var(--mustard);top:10%;
  animation:sweep 1.8s ease-in-out infinite alternate;border-radius:3px;opacity:.9}
@keyframes sweep{to{top:88%}}
.scanbar{position:absolute;left:0;right:0;bottom:0;padding:18px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--paper);text-align:center}
.scanbar .hint{font-weight:700;font-size:17px;text-shadow:0 1px 3px #000}
.scanmsg{position:absolute;left:50%;top:calc(44% + min(35vw,150px) + 26px);transform:translateX(-50%);width:min(88vw,360px);
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;text-align:center;font-weight:700}

/* reproductor */
.record{position:relative;width:min(74vw,320px);aspect-ratio:1;border-radius:50%;
  background:repeating-radial-gradient(circle,#2a1a12 0 2px,#3A2216 2px 5px);border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(58,34,22,.6)}
.record .label{position:absolute;inset:31%;border-radius:50%;background:var(--mustard);display:grid;place-items:center;border:2px solid var(--ink)}
.record .label span{font-family:var(--display);font-size:clamp(12px,3.4vw,15px);color:var(--ink);transform:rotate(-8deg);white-space:nowrap}
.record .hole{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--paper)}
.spin{animation:spin 2.4s linear infinite}
.paused .spin{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin,.frame::after{animation:none}}
.ring{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:rgba(251,241,220,.35)}
.ring .bar{stroke:var(--paper);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.time{font-family:var(--display);font-size:40px;color:var(--paper);text-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.controls{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.round.main{width:80px;height:80px;background:var(--mustard)}
.round:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.round svg{width:28px;height:28px}
.round.main svg{width:34px;height:34px}

.answer{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:14px 18px;width:min(100%,360px);text-align:center;box-shadow:4px 4px 0 var(--ink)}
.answer .y{font-family:var(--display);font-size:46px;line-height:1.05;color:var(--rust)}
.answer .a{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.answer .t{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2;margin-top:4px;text-wrap:balance}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:12px;font-weight:700;max-width:90vw;text-align:center;z-index:5}
</style>
</head>
<body>
<div class="rings" aria-hidden="true"></div>

<!-- INICIO -->
<section class="screen" id="home">
  <div class="logo">MosyMusic</div>
  <div class="plate">
    <svg class="daisy" viewBox="-50 -50 100 100" aria-hidden="true"><g fill="#FBF1DC" stroke="#3A2216" stroke-width="3">
      <ellipse rx="11" ry="22" cy="-26"/><ellipse rx="11" ry="22" cy="-26" transform="rotate(45)"/><ellipse rx="11" ry="22" cy="-26" transform="rotate(90)"/><ellipse rx="11" ry="22" cy="-26" transform="rotate(135)"/>
      <ellipse rx="11" ry="22" cy="-26" transform="rotate(180)"/><ellipse rx="11" ry="22" cy="-26" transform="rotate(225)"/><ellipse rx="11" ry="22" cy="-26" transform="rotate(270)"/><ellipse rx="11" ry="22" cy="-26" transform="rotate(315)"/></g>
      <circle r="15" fill="#E7A23A" stroke="#3A2216" stroke-width="3"/></svg>
    <p>Apunta al QR de una carta y la canción sonará sin mostrar el título.</p>
    <button class="btn big" id="startBtn">Escanear carta</button>
    <p class="small">Suena un fragmento de 30 segundos. No necesitas Spotify.</p>
  </div>
  <button class="link" id="randomBtn" style="color:var(--paper)">Probar con una canción al azar</button>
</section>

<!-- ESCÁNER -->
<section class="screen" id="scan" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="frame" aria-hidden="true"></div>
  <div class="scanmsg" id="scanMsg" hidden></div>
  <div class="scanbar">
    <div class="hint">Centra el QR de la carta en el recuadro</div>
    <button class="btn alt" id="cancelScan">Cancelar</button>
  </div>
</section>

<!-- REPRODUCTOR -->
<section class="screen" id="play" hidden>
  <div class="record" id="recordWrap">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="bar" id="bar" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
    <div class="spin" style="position:absolute;inset:0;border-radius:50%">
      <div class="label"><span>MosyMusic</span></div>
      <div class="hole"></div>
    </div>
  </div>

  if (!scanning) return;
  const v = $("video");
  if (v.readyState >= 2){
    const txt = await readFrame(v);
    if (txt && scanning) return handleCode(txt);
  }
  setTimeout(() => requestAnimationFrame(tick), detector ? 120 : 160);
}
function handleCode(txt){
  const m = RX.exec(txt);
  const id = m && m[1];
  // la carta que acaba de sonar sigue delante de la cámara: se ignora unos segundos
  if (id && id === current && Date.now() - scanStartedAt < 5000){
    setTimeout(() => requestAnimationFrame(tick), 300); return;
  }
  if (id && SONGS[id]){
    if (navigator.vibrate) navigator.vibrate(60);
    stopScan(); playSong(id); return;
  }
  if (txt !== lastBad){ lastBad = txt; scanFail("Ese QR no es de una carta de MosyMusic."); }
  setTimeout(() => requestAnimationFrame(tick), 400);
}
$("startBtn").onclick = startScan;
$("cancelScan").onclick = () => { stopScan(); show("home"); };
$("randomBtn").onclick = () => { unlockAudio(); const ids = Object.keys(SONGS); playSong(ids[Math.floor(Math.random() * ids.length)]); };

/* pantalla encendida mientras suena */
let wakeLock = null;
async function acquireWakeLock(){ try{ if ("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } }catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.hidden && scanning){ stopScan(); show("home"); } });
setPlayingUI();
</script>
